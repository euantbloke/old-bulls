<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Old Bulls | Raith and Abbotshall Curling Club</title>
<meta name="description" content="League tables, fixtures and results for the Old Bulls senior league at Raith and Abbotshall Curling Club, Kirkcaldy.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ice:#e9eff3;
  --sheet:#ffffff;
  --granite:#16232c;
  --slate:#5d7180;
  --hairline:#cfdae1;
  --house-red:#c1372c;
  --house-blue:#2a6b9b;
  --gold:#c9971b;
  --win:#1f6b4a;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
  --pad:clamp(16px,4vw,32px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ice);color:var(--granite);
  font-family:var(--body);font-size:17.5px;line-height:1.5;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3,th,.eyebrow,nav button,.badge{font-family:var(--display)}
a{color:var(--house-blue)}

/* ---------- masthead ---------- */
.masthead{background:var(--granite);color:#fff;padding:var(--pad) var(--pad) 0}
.mast-inner{max-width:1080px;margin:0 auto;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.house-mark{flex:0 0 auto}
.mast-text h1{
  margin:0;font-size:clamp(30px,7vw,50px);font-weight:800;
  letter-spacing:-.02em;text-transform:uppercase;line-height:.95;
}
.mast-text p{margin:6px 0 0;color:#9fb4c1;font-size:15.5px;letter-spacing:.06em;text-transform:uppercase}
.season-pick{margin-left:auto;display:flex;gap:8px;align-items:center}
.season-pick label{color:#9fb4c1;font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.season-pick select{
  font:600 16px var(--body);background:#263945;color:#fff;
  border:1px solid #3d5462;border-radius:6px;padding:7px 10px;
}
nav{max-width:1080px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding-top:18px}
nav button{
  background:none;border:0;border-bottom:3px solid transparent;color:#9fb4c1;
  font-size:15px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:12px 14px;cursor:pointer;white-space:nowrap;
}
nav button:hover{color:#fff}
nav button[aria-current="page"]{color:#fff;border-bottom-color:var(--house-red)}
nav button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

main{max-width:1080px;margin:0 auto;padding:var(--pad) var(--pad) 72px}
.view{display:none}
.view.on{display:block;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.eyebrow{
  font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--slate);margin:0 0 10px;
}
h2{font-size:clamp(22px,4vw,29px);font-weight:700;letter-spacing:-.01em;margin:0 0 4px;text-transform:uppercase}
h3{font-size:19px;font-weight:700;margin:0 0 2px;letter-spacing:-.005em}
.sub{color:var(--slate);font-size:16px;margin:0 0 20px}

/* ---------- the draw board (signature) ---------- */
.board{
  background:var(--granite);color:#fff;border-radius:14px;overflow:hidden;
  position:relative;margin-bottom:28px;
}
.board::after{
  content:"";position:absolute;right:-90px;top:50%;transform:translateY(-50%);
  width:300px;height:300px;border-radius:50%;opacity:.14;pointer-events:none;
  background:
    radial-gradient(circle,#fff 0 8%,transparent 8%),
    radial-gradient(circle,var(--house-red) 0 26%,transparent 26%),
    radial-gradient(circle,#fff 0 44%,transparent 44%),
    radial-gradient(circle,var(--house-blue) 0 68%,transparent 68%),
    radial-gradient(circle,#fff 0 100%);
}
.board-head{padding:22px var(--pad) 4px;position:relative;z-index:1}
.board-head .eyebrow{color:#8fa8b8}
.board-head h2{margin:0;color:#fff}
.board-head .when{color:var(--gold);font-weight:700;font-size:18px;margin-top:4px}
.rinks{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:1px;
  background:#2b3d49;margin-top:18px;position:relative;z-index:1}
.rink{background:var(--granite);padding:16px var(--pad)}
.rink .sheet-id{
  font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:#8fa8b8;margin-bottom:8px;
}
.rink .pair{display:flex;align-items:baseline;gap:9px;font-size:17px}
.rink .num{
  font-family:var(--display);font-weight:800;font-size:15px;color:var(--granite);
  background:#fff;border-radius:5px;padding:1px 8px;flex:0 0 auto;
}
.rink .v{color:#8fa8b8;font-size:13px;font-weight:700;letter-spacing:.1em;margin:5px 0}
.rink .skip{color:#dbe6ed}

/* ---------- cards and tables ---------- */
.card{background:var(--sheet);border:1px solid var(--hairline);border-radius:12px;
  padding:20px var(--pad);margin-bottom:22px}
.card > .eyebrow:first-child{margin-top:0}
.table-wrap{overflow-x:auto;margin:0 calc(var(--pad) * -1);padding:0 var(--pad)}
table{border-collapse:collapse;width:100%;min-width:560px}
caption{text-align:left;font-family:var(--display);font-weight:700;font-size:19px;
  text-transform:uppercase;letter-spacing:.01em;padding-bottom:2px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--hairline)}
th{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--slate);border-bottom:2px solid var(--granite);white-space:nowrap}
th:nth-child(-n+3),td:nth-child(-n+3){text-align:left}
td.pos{font-family:var(--display);font-weight:700;width:34px;color:var(--slate)}
td.tno{font-family:var(--display);font-weight:800}
td.skip{font-weight:600;white-space:nowrap}
td.pts{font-family:var(--display);font-weight:800;font-size:18px}
tbody tr:last-child td{border-bottom:0}
tr.leader td{background:#f4f8e9}
tr.leader td.pos{color:var(--granite)}
.pos-mark{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:-1px;
  margin-right:5px;background:
    radial-gradient(circle,var(--house-red) 0 34%,transparent 34%),
    radial-gradient(circle,#fff 0 62%,transparent 62%),
    radial-gradient(circle,var(--house-blue) 0 100%)}
.pos-line{border-bottom:2px dashed var(--slate)!important}
.neg{color:var(--house-red)}
.foot-note{font-size:14.5px;color:var(--slate);margin:12px 0 0}

/* ---------- results ---------- */
.round{margin-bottom:18px}
.round h3{font-size:15px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate);
  border-bottom:1px solid var(--hairline);padding-bottom:6px;margin-bottom:8px}
.match{display:grid;grid-template-columns:26px 1fr auto 1fr;gap:10px;align-items:baseline;
  padding:7px 0;font-size:17px}
.match .sh{font-family:var(--display);font-size:12px;font-weight:700;color:var(--slate);letter-spacing:.1em}
.match .home{text-align:right}
.match .score{font-family:var(--display);font-weight:800;font-size:18px;white-space:nowrap;padding:0 4px}
.match .w{color:var(--win)}

/* ---------- teams ---------- */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.team{background:var(--sheet);border:1px solid var(--hairline);border-radius:12px;padding:16px 18px}
.team .tn{font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate)}
.team ul{list-style:none;margin:10px 0 0;padding:0}
.team li{padding:4px 0;border-top:1px solid var(--hairline);font-size:16.5px}
.team li.cap{border-top:0;font-weight:700;padding-top:0}
.team li.later{color:var(--slate)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:var(--house-red);color:#fff;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* ---------- fixtures ---------- */
.fx{width:100%;border-collapse:collapse;min-width:520px}
.fx th,.fx td{padding:8px;text-align:left;border-bottom:1px solid var(--hairline)}
.fx td.d{white-space:nowrap;font-weight:600;width:1%}
.fx td.m{font-family:var(--display);font-weight:600}
.fx tr.past td{color:var(--slate)}
.fx tr.next td{background:#fdf6e0}
.away{list-style:none;padding:0;margin:0}
.away li{padding:9px 0;border-bottom:1px solid var(--hairline);font-size:16.5px}
.away li:last-child{border-bottom:0}
.away b{display:block;font-family:var(--display);font-size:13px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--slate)}

.empty{background:#fdf6e0;border:1px solid #e6d49a;border-radius:10px;padding:16px 18px;
  color:#6b5312;font-size:16.5px}
.honours{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.trophy{background:var(--sheet);border:1px solid var(--hairline);border-radius:12px;padding:18px}
.trophy .name{font-family:var(--display);font-weight:800;font-size:17px;text-transform:uppercase;
  letter-spacing:.02em;line-height:1.2}
.trophy .terms{color:var(--slate);font-size:14.5px;margin:6px 0 12px}
.trophy .holder{font-size:20px;font-weight:700}
.trophy .holder span{display:block;font-size:14px;color:var(--slate);font-weight:400}
details{margin-top:14px}
summary{cursor:pointer;font-weight:600;color:var(--house-blue)}
footer{border-top:1px solid var(--hairline);margin-top:40px;padding:22px var(--pad) 40px;
  color:var(--slate);font-size:14.5px}
footer .wrap{max-width:1080px;margin:0 auto}
.print-btn{background:var(--granite);color:#fff;border:0;border-radius:7px;
  font:600 15px var(--body);padding:9px 16px;cursor:pointer}

/* ---------- results entry ---------- */
.enter-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px;margin-top:6px}
.rinkcard{border:1px solid var(--hairline);border-radius:11px;padding:14px 16px;background:var(--sheet)}
.rinkcard .sheet-id{font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--slate);margin-bottom:10px}
.side{display:grid;grid-template-columns:1fr 74px 74px;gap:8px;align-items:center;margin-bottom:8px}
.side .who{font-size:16.5px;font-weight:600;line-height:1.2}
.side .who small{display:block;font-weight:400;color:var(--slate);font-size:13px}
.side input{width:100%;font:700 19px var(--body);text-align:center;padding:9px 4px;
  border:1px solid var(--hairline);border-radius:7px;background:#fff;color:var(--granite);
  font-variant-numeric:tabular-nums}
.side input:focus{outline:3px solid var(--gold);outline-offset:1px;border-color:var(--granite)}
.side input.bad{border-color:var(--house-red);background:#fdf0ee}
.rinkcard.clearing{border-color:var(--house-red);border-style:dashed;background:#fdf6f5}
.rinkcard.clearing .side .who{color:var(--slate);text-decoration:line-through}
.rink-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.rink-top .sheet-id{margin-bottom:0}
.btn-clear{background:none;border:1px solid var(--hairline);border-radius:6px;color:var(--slate);
  font:600 13px var(--body);padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn-clear:hover{border-color:var(--house-red);color:var(--house-red)}
.btn-clear:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.clear-note{display:none;font-size:14px;font-weight:600;color:var(--house-red);margin-top:4px}
.rinkcard.clearing .clear-note{display:block}
.colhead{display:grid;grid-template-columns:1fr 74px 74px;gap:8px;margin-bottom:4px}
.colhead span{font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--slate);text-align:center}
.colhead span:first-child{text-align:left}
.entry-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-top:18px}
.field label{display:block;font-family:var(--display);font-size:11.5px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--slate);margin-bottom:4px}
.field input,.field select{font:600 17px var(--body);padding:10px 12px;border:1px solid var(--hairline);
  border-radius:7px;background:#fff;color:var(--granite)}
.field input{width:150px}
.btn-save{background:var(--house-red);color:#fff;border:0;border-radius:8px;
  font:700 17px var(--display);letter-spacing:.04em;padding:12px 26px;cursor:pointer}
.btn-save:hover{background:#a72c22}
.btn-save:disabled{background:var(--slate);cursor:default}
.msg{margin-top:14px;padding:13px 16px;border-radius:9px;font-size:16.5px;display:none}
.msg.on{display:block}
.msg.good{background:#e7f3ea;border:1px solid #a9cdb4;color:#1c5c37}
.msg.bad{background:#fdf0ee;border:1px solid #e2b0aa;color:#8c261c}
.msg.busy{background:#eef3f7;border:1px solid var(--hairline);color:var(--slate)}

@media (max-width:600px){
  .match{grid-template-columns:22px 1fr auto 1fr;font-size:16px;gap:6px}
  th,td{padding:8px 5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .masthead nav,.season-pick,.print-btn,footer,.board::after{display:none}
  body{background:#fff;font-size:11pt}
  .masthead{background:#fff;color:#000;padding:0 0 8pt;border-bottom:2pt solid #000}
  .mast-text h1{color:#000}
  .card{border:0;padding:0;page-break-inside:avoid}
  .view{display:none!important}
  .view.on{display:block!important}
}
</style>
</head>

/* ============================================================
   3. TABLE ENGINE
   ============================================================ */
const TROPHIES = {
  league:  {1:{name:"League 1", teams:[1,2,3,4]}, 2:{name:"League 2", teams:[5,6,7,8]}},
  playoff: {bell:{name:"Duncan Bell Trophy", terms:"Playoff of the league winners and runners up"},
            tor: {name:"Toreador Salver", terms:"Playoff of the third and fourth placed teams"}},
  full:    {name:"Old Bull Trophy", terms:"Winner of the full league, December to March"}
};

function buildTable(matches, teamIds){
  const t = new Map();
  const touch = id => {
    if(!t.has(id)) t.set(id,{team:id,p:0,w:0,l:0,d:0,f:0,a:0,e:0,pts:0});
    return t.get(id);
  };
  (teamIds||[]).forEach(touch);
  for(const m of matches){
    for(const [me,you] of [["A","B"],["B","A"]]){
      const id = m["team"+me];
      if(teamIds && !teamIds.includes(id)) continue;
      const r = touch(id), sf = m["shots"+me], sa = m["shots"+you];
      r.p++; r.f += sf; r.a += sa; r.e += m["ends"+me];
      if(sf > sa){ r.w++; r.pts += 2; }
      else if(sf < sa){ r.l++; }
      else { r.d++; r.pts += 1; }
    }
  }
  return [...t.values()].map(r => ({...r, sd:r.f - r.a}))
    .sort((x,y) => y.pts-x.pts || y.sd-x.sd || y.e-x.e || y.f-x.f || x.team-y.team);
}

/* Once both mini leagues are complete, the placeholder playoff draw resolves
   to real team numbers: "L1-2" means the runner up in League 1. */
function resolveDraw(season){
  const played = season.results.filter(m => m.phase === "league");
  const complete = played.length === 24;
  const map = {};
  if(complete){
    [1,2].forEach(lg => {
      buildTable(played, TROPHIES.league[lg].teams)
        .forEach((r,i) => map["L"+lg+"-"+(i+1)] = r.team);
    });
  }
  return {complete, map};
}
function playoffGroups(season){
  const {complete, map} = resolveDraw(season);
  if(!complete) return null;
  return {
    bell:[map["L1-1"],map["L1-2"],map["L2-1"],map["L2-2"]],
    tor: [map["L1-3"],map["L1-4"],map["L2-3"],map["L2-4"]]
  };
}
function fixtureTeams(season, phase, entry){
  const {map} = resolveDraw(season);
  const one = v => (typeof v === "number") ? v : (map[v] ?? null);
  return [one(entry[1]), one(entry[2])];
}
function placeholderLabel(v){
  if(typeof v === "number") return "Team " + v;
  const [lg,pos] = v.split("-");
  return ["1st","2nd","3rd","4th"][pos-1] + " " + (lg === "L1" ? "League 1" : "League 2");
}

/* ============================================================
   4. RENDERING
   ============================================================ */
let SEASON_KEY = Object.keys(SEASONS).find(k => SEASONS[k].current);
const S = () => SEASONS[SEASON_KEY];
const ORDER = ["league","playoff","full"];
const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",
  {weekday:"short", day:"numeric", month:"long", year:"numeric"});
const fmtShort = iso => new Date(iso+"T12:00:00").toLocaleDateString("en-GB",
  {weekday:"short", day:"numeric", month:"short"});
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const skipOf = n => S().teams[n] ? S().teams[n].skip : "";

function resultFor(phase, round, a, b){
  return S().results.find(m => m.phase === phase && m.round === round &&
    ((m.teamA === a && m.teamB === b) || (m.teamA === b && m.teamB === a)));
}
function roundPlayed(phase, round){
  return S().results.some(m => m.phase === phase && m.round === round);
}

/* the next night that has no results in yet */
function nextRound(){
  for(const phase of ORDER){
    const ph = S().phases[phase];
    for(let r = 1; r <= ph.dates.length; r++){
      if(!roundPlayed(phase, r)) return {phase, round:r, date:ph.dates[r-1]};
    }
  }
  return null;
}

function tableHTML(caption, rows, opts={}){
  const cut = opts.splitAfter || 0;
  const body = rows.map((r,i) => `
    <tr class="${i===0 && r.p>0 ? "leader":""} ${cut && i===cut-1 ? "pos-line":""}">
      <td class="pos">${i===0 && r.p>0 ? '<span class="pos-mark"></span>':''}${i+1}</td>
      <td class="tno">${r.team}</td>
      <td class="skip">${esc(skipOf(r.team))}</td>
      <td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.d}</td>
      <td>${r.f}</td><td>${r.a}</td><td>${r.e}</td>
      <td class="${r.sd<0?"neg":""}">${r.sd>0?"+":""}${r.sd}</td>
      <td class="pts">${r.pts}</td>
    </tr>`).join("");
  return `<div class="table-wrap"><table>
    <caption>${esc(caption)}</caption>
    <thead><tr>
      <th>Pos</th><th>Team</th><th>Skip</th><th>P</th><th>W</th><th>L</th><th>D</th>
      <th>For</th><th>Ag</th><th>Ends</th><th>Shot diff</th><th>Pts</th>
    </tr></thead><tbody>${body}</tbody></table></div>`;
}

function renderHome(){
  const nx = nextRound();
  let board = "";
  if(nx){
    const ph = S().phases[nx.phase];
    const cards = ph.fixtures[nx.round].map(fx => {
      const [a,b] = fixtureTeams(S(), nx.phase, fx);
      const side = (t, raw) => t
        ? `<div class="pair"><span class="num">${t}</span><span class="skip">${esc(skipOf(t))}</span></div>`
        : `<div class="pair"><span class="skip">${esc(placeholderLabel(raw))}</span></div>`;
      return `<div class="rink">
        <div class="sheet-id">Sheet ${fx[0]}</div>
        ${side(a, fx[1])}<div class="v">v</div>${side(b, fx[2])}
      </div>`;
    }).join("");
    board = `<div class="board">
      <div class="board-head">
        <p class="eyebrow">Next on the ice &middot; ${esc(ph.label)}, round ${nx.round}</p>
        <h2>The Draw</h2>
        <p class="when">${fmtDate(nx.date)}</p>
      </div>
      <div class="rinks">${cards}</div>
    </div>`;
  } else {
    board = `<div class="board"><div class="board-head">
      <p class="eyebrow">Season complete</p><h2>That is the ice off</h2>
      <p class="when">All rounds played</p></div><div class="rinks"></div></div>`;
  }

  let live = "";
  const played = S().results;
  if(played.length === 0){
    live = `<div class="empty"><strong>No results yet.</strong> Tables appear here as soon as
      the first night's scores are entered. The full fixture list is on the Fixtures page.</div>`;
  } else {
    const phase = [...ORDER].reverse().find(p => played.some(m => m.phase === p));
    if(phase === "league"){
      live = `<div class="card">${tableHTML("League 1", buildTable(played.filter(m=>m.phase==="league"),[1,2,3,4]))}</div>
              <div class="card">${tableHTML("League 2", buildTable(played.filter(m=>m.phase==="league"),[5,6,7,8]))}</div>`;
    } else if(phase === "playoff"){
      const g = playoffGroups(S());
      const pm = played.filter(m=>m.phase==="playoff");
      live = `<div class="card">${tableHTML("Duncan Bell Trophy", buildTable(pm,g.bell))}</div>
              <div class="card">${tableHTML("Toreador Salver", buildTable(pm,g.tor))}</div>`;
    } else {
      live = `<div class="card">${tableHTML("Old Bull Trophy",
        buildTable(played.filter(m=>m.phase==="full"),[1,2,3,4,5,6,7,8]), {splitAfter:4})}
        <p class="foot-note">The dashed line marks the top four, who play Kirkcaldy Senior Ladies in March.</p></div>`;
    }
  }

  const last = lastResultsBlock();
  document.getElementById("v-home").innerHTML = board + live + last;
}

function lastResultsBlock(){
  const played = S().results;
  if(!played.length) return "";
  let found = null;
  for(const phase of [...ORDER].reverse()){
    const rs = played.filter(m => m.phase === phase).map(m => m.round);
    if(rs.length){ found = {phase, round:Math.max(...rs)}; break; }
  }
  const ms = played.filter(m => m.phase === found.phase && m.round === found.round);
  return `<div class="card">
    <p class="eyebrow">Latest results &middot; ${esc(S().phases[found.phase].label)}, round ${found.round}</p>
    ${ms.map(matchLine).join("")}
  </div>`;
}

function matchLine(m){
  const aw = m.shotsA > m.shotsB, bw = m.shotsB > m.shotsA;
  return `<div class="match">
    <span class="sh">${m.sheet}</span>
    <span class="home"><b>${m.teamA}</b> ${esc(skipOf(m.teamA))}</span>
    <span class="score"><span class="${aw?"w":""}">${m.shotsA}</span> &ndash;
      <span class="${bw?"w":""}">${m.shotsB}</span></span>
    <span><b>${m.teamB}</b> ${esc(skipOf(m.teamB))}</span>
  </div>`;
}

function renderTables(){
  const played = S().results;
  const lg = played.filter(m=>m.phase==="league");
  const po = played.filter(m=>m.phase==="playoff");
  const fl = played.filter(m=>m.phase==="full");
  const g = playoffGroups(S());
  let html = `<p class="eyebrow">Standings</p><h2>League Tables</h2>
    <p class="sub">Two points for a win, one for a draw. Teams level on points are separated by
    shot difference, then ends won, then shots for.</p>`;

  html += `<div class="card">${tableHTML("League 1, September to November", buildTable(lg,[1,2,3,4]))}
    ${tableHTML("League 2, September to November", buildTable(lg,[5,6,7,8]))}
    <p class="foot-note">The top two in each league go into the Duncan Bell Trophy playoff,
      the bottom two into the Toreador Salver.</p></div>`;

  if(g){
    html += `<div class="card">${tableHTML("Duncan Bell Trophy", buildTable(po,g.bell))}
      ${tableHTML("Toreador Salver", buildTable(po,g.tor))}</div>`;
  } else {
    html += `<div class="card"><p class="eyebrow">Trophy playoffs</p>
      <div class="empty">The playoff draw is set by the two league tables above and will appear
      here once all six league rounds are played.</div></div>`;
  }

  html += `<div class="card">${tableHTML("Old Bull Trophy, December to March",
    buildTable(fl,[1,2,3,4,5,6,7,8]), {splitAfter:4})}
    <p class="foot-note">The dashed line marks the top four, who play Kirkcaldy Senior Ladies in March.</p>
    <button class="print-btn" onclick="window.print()">Print this page for the notice board</button></div>`;

  document.getElementById("v-tables").innerHTML = html;
}

function renderFixtures(){
  let html = `<p class="eyebrow">Season ${esc(SEASON_KEY)}</p><h2>Fixtures</h2>
    <p class="sub">All league nights are Tuesdays at Fife Ice Arena, sheets B, C, D and E.</p>`;
  const nx = nextRound();
  for(const phase of ORDER){
    const ph = S().phases[phase];
    const rows = ph.dates.map((d,i) => {
      const rnd = i + 1;
      const cells = ph.fixtures[rnd].map(fx => {
        const [a,b] = fixtureTeams(S(), phase, fx);
        return (a && b) ? `${a} v ${b}`
          : `<span style="font-weight:400">${esc(placeholderLabel(fx[1]))} v ${esc(placeholderLabel(fx[2]))}</span>`;
      });
      const cls = (nx && nx.phase===phase && nx.round===rnd) ? "next"
                : roundPlayed(phase,rnd) ? "past" : "";
      return `<tr class="${cls}"><td class="d">${rnd}</td><td class="d">${fmtShort(d)}</td>
        ${cells.map(c=>`<td class="m">${c}</td>`).join("")}</tr>`;
    }).join("");
    html += `<div class="card"><p class="eyebrow">${esc(ph.window)}</p><h3>${esc(ph.label)}</h3>
      <div class="table-wrap"><table class="fx"><thead><tr>
        <th>Rd</th><th>Date</th><th>Sheet B</th><th>Sheet C</th><th>Sheet D</th><th>Sheet E</th>
      </tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  html += `<div class="card"><p class="eyebrow">Away and friendly matches</p>
    <ul class="away">${S().away.map(a =>
      `<li><b>${esc(a.when)}</b>${esc(a.who)}. ${esc(a.where)}.${a.note ? " " + esc(a.note) + "." : ""}</li>`
    ).join("")}</ul></div>`;
  document.getElementById("v-fixtures").innerHTML = html;
}

function renderResults(){
  const played = S().results;
  let html = `<p class="eyebrow">Season ${esc(SEASON_KEY)}</p><h2>Results</h2>`;
  if(!played.length){
    html += `<div class="empty"><strong>No results yet.</strong> The first night is
      ${fmtDate(S().phases.league.dates[0])}.</div>`;
    document.getElementById("v-results").innerHTML = html;
    return;
  }
  html += `<p class="sub">${played.length} matches played.</p>`;
  for(const phase of ORDER){
    const ph = S().phases[phase];
    const any = played.some(m => m.phase === phase);
    if(!any) continue;
    html += `<div class="card"><p class="eyebrow">${esc(ph.label)}</p>`;
    for(let r = 1; r <= ph.dates.length; r++){
      const ms = played.filter(m => m.phase === phase && m.round === r);
      if(!ms.length) continue;
      html += `<div class="round"><h3>Round ${r}, ${fmtShort(ph.dates[r-1])}</h3>
        ${ms.map(matchLine).join("")}</div>`;
    }
    html += `</div>`;
  }
  document.getElementById("v-results").innerHTML = html;
}

function renderTeams(){
  const t = S().teams;
  const cards = Object.keys(t).map(n => {
    const team = t[n];
    const later = (team.later||[]).map(p =>
      `<li class="later">${esc(p)} <span style="font-size:13px">(after New Year)</span></li>`).join("");
    return `<div class="team">
      <div class="tn">Team ${n}</div>
      <ul>
        <li class="cap">${esc(team.skip)}<span class="badge">Skip</span></li>
        ${team.players.map(p => `<li>${esc(p)}</li>`).join("")}
        ${later}
      </ul></div>`;
  }).join("");
  const notes = S().notes.length
    ? `<div class="card"><p class="eyebrow">Notes</p>${S().notes.map(n=>`<p style="margin:4px 0">${esc(n)}</p>`).join("")}</div>`
    : "";
  document.getElementById("v-teams").innerHTML =
    `<p class="eyebrow">Season ${esc(SEASON_KEY)}</p><h2>Teams</h2>
     <p class="sub">Eight teams. Skips are shown first.</p>
     <div class="teams">${cards}</div>${notes}
     <div class="card"><p class="eyebrow">Contact details</p>
       <p style="margin:0">Phone numbers and email addresses are not published on this site.
       The contact list is circulated by email to members only.</p></div>`;
}

function renderHonours(){
  const winners = [];
  for(const key of Object.keys(SEASONS)){
    const s = SEASONS[key];
    const res = s.results;
    if(!res.length) continue;
    const nameOf = n => s.teams[n] ? s.teams[n].skip : "Team " + n;
    const fl = res.filter(m=>m.phase==="full");
    const po = res.filter(m=>m.phase==="playoff");
    const complete = fl.length === s.phases.full.dates.length * 4;
    if(!complete) continue;
    const gp = (() => {
      const lgm = res.filter(m=>m.phase==="league");
      if(lgm.length !== 24) return null;
      const m1 = buildTable(lgm,[1,2,3,4]).map(r=>r.team);
      const m2 = buildTable(lgm,[5,6,7,8]).map(r=>r.team);
      return {bell:[m1[0],m1[1],m2[0],m2[1]], tor:[m1[2],m1[3],m2[2],m2[3]]};
    })();
    winners.push({
      season:key,
      oldbull: buildTable(fl,[1,2,3,4,5,6,7,8])[0],
      bell: gp ? buildTable(po,gp.bell)[0] : null,
      tor:  gp ? buildTable(po,gp.tor)[0]  : null,
      nameOf
    });
  }
  const card = (name, terms, w, nameOf, season) => `
    <div class="trophy"><div class="name">${esc(name)}</div>
      <p class="terms">${esc(terms)}</p>
      ${w ? `<div class="holder">${esc(nameOf(w.team))}
        <span>Team ${w.team} &middot; ${season} &middot; ${w.pts} points</span></div>`
          : `<div class="holder" style="color:var(--slate);font-size:16px">Not yet awarded</div>`}
    </div>`;
  let html = `<p class="eyebrow">Roll of honour</p><h2>Trophies</h2>
    <p class="sub">Three trophies are played for each season.</p>`;
  if(!winners.length){
    html += `<div class="honours">
      ${card("Old Bull Trophy", TROPHIES.full.terms, null, null, "")}
      ${card("Duncan Bell Trophy", TROPHIES.playoff.bell.terms, null, null, "")}
      ${card("Toreador Salver", TROPHIES.playoff.tor.terms, null, null, "")}</div>`;
  }
  for(const w of winners){
    html += `<div class="card"><p class="eyebrow">Season ${esc(w.season)}</p>
      <div class="honours">
        ${card("Old Bull Trophy", TROPHIES.full.terms, w.oldbull, w.nameOf, w.season)}
        ${card("Duncan Bell Trophy", TROPHIES.playoff.bell.terms, w.bell, w.nameOf, w.season)}
        ${card("Toreador Salver", TROPHIES.playoff.tor.terms, w.tor, w.nameOf, w.season)}
      </div></div>`;
  }
  html += `<div class="card"><p class="eyebrow">About these records</p>
    <p style="margin:0 0 10px">The 2025/26 figures were recovered from the club spreadsheet and
    reproduce the published final standings exactly across all five tables.</p>
    <details><summary>One known discrepancy in the 2025/26 source</summary>
      <p style="font-size:16px;color:var(--slate)">In round 9 of the Old Bull league, team 1 recorded
      a 6 to 4 win over team 5, while team 5 recorded a 3 to 5 defeat. The two rows disagree by one
      shot each way. Team 1's version is used here. Points, shot difference and final positions are
      unaffected.</p></details></div>`;
  document.getElementById("v-honours").innerHTML = html;
}

/* ============================================================
   5. ENTERING RESULTS
   ============================================================ */
let ENTRY_ROUND = null;   // {phase, round}
let ENTRY_CODE  = "";     // held for this visit only, never stored

function allRounds(){
  const out = [];
  for(const phase of ORDER){
    const ph = S().phases[phase];
    ph.dates.forEach((d,i) => out.push({phase, round:i+1, date:d, label:ph.label}));
  }
  return out;
}

function renderEnter(){
  const host = document.getElementById("v-enter");
  if(!S().current){
    host.innerHTML = `<p class="eyebrow">Results entry</p><h2>Enter Results</h2>
      <div class="empty">You are viewing the ${esc(SEASON_KEY)} archive. Switch the season
      selector back to the current season to enter results.</div>`;
    return;
  }

  const rounds = allRounds();
  if(!ENTRY_ROUND){
    const nx = nextRound();
    ENTRY_ROUND = nx ? {phase:nx.phase, round:nx.round}
                     : {phase:rounds[rounds.length-1].phase, round:rounds[rounds.length-1].round};
  }
  const cur = rounds.find(r => r.phase===ENTRY_ROUND.phase && r.round===ENTRY_ROUND.round);
  const ph  = S().phases[cur.phase];

  const options = rounds.map(r => {
    const done = roundPlayed(r.phase, r.round) ? " (entered)" : "";
    return `<option value="${r.phase}|${r.round}" ${r.phase===cur.phase && r.round===cur.round ? "selected":""}
      >${esc(r.label)}, round ${r.round}, ${fmtShort(r.date)}${done}</option>`;
  }).join("");

  let cards, blocked = "";
  const unresolved = ph.fixtures[cur.round].some(fx => {
    const [a,b] = fixtureTeams(S(), cur.phase, fx);
    return !a || !b;
  });

  if(unresolved){
    blocked = `<div class="empty">The playoff draw is not settled yet. Enter all six league
      rounds first and the team numbers for this night will fill in on their own.</div>`;
    cards = "";
  } else {
    cards = ph.fixtures[cur.round].map(fx => {
      const [a,b] = fixtureTeams(S(), cur.phase, fx);
      const ex = resultFor(cur.phase, cur.round, a, b);
      const swap = ex && ex.teamA !== a;
      const val = (side, field) => {
        if(!ex) return "";
        const key = field + (swap ? (side==="A"?"B":"A") : side);
        return ex[key] ?? "";
      };
      const row = (side, team) => `
        <div class="side">
          <div class="who">Team ${team}<small>${esc(skipOf(team))}</small></div>
          <input type="number" inputmode="numeric" min="0" max="40" step="1"
            aria-label="Shots for team ${team}" data-k="shots${side}" value="${val(side,"shots")}">
          <input type="number" inputmode="numeric" min="0" max="16" step="1"
            aria-label="Ends won by team ${team}" data-k="ends${side}" value="${val(side,"ends")}">
        </div>`;
      return `<div class="rinkcard" data-sheet="${fx[0]}" data-a="${a}" data-b="${b}"
                   data-saved="${ex ? "1" : "0"}" data-clear="0">
        <div class="rink-top">
          <div class="sheet-id">Sheet ${fx[0]}</div>
          <button type="button" class="btn-clear" data-clear-sheet="${fx[0]}">Clear rink</button>
        </div>
        <div class="colhead"><span></span><span>Shots</span><span>Ends</span></div>
        ${row("A",a)}${row("B",b)}
        <p class="clear-note">Will be cleared when you save.</p>
      </div>`;
    }).join("");
  }

  host.innerHTML = `
    <p class="eyebrow">Results entry</p><h2>Enter Results</h2>
    <p class="sub">Pick the night, type the shots and ends for each rink, then save.
      Everything else on the site updates itself.</p>
    <div class="card">
      <div class="field" style="max-width:520px">
        <label for="round-pick">Which night</label>
        <select id="round-pick" style="width:100%">${options}</select>
      </div>
      ${blocked}
      <div class="enter-grid">${cards}</div>
      ${cards ? `
      <div class="entry-bar">
        <div class="field">
          <label for="entry-code">Club code</label>
          <input id="entry-code" type="password" inputmode="numeric"
                 autocomplete="off" value="${esc(ENTRY_CODE)}">
        </div>
        <button class="btn-save" id="btn-save" type="button">Save results</button>
      </div>` : ""}
      <div class="msg" id="entry-msg" role="status" aria-live="polite"></div>
      <p class="foot-note">Leave a rink blank if it was not played. To correct a score, type the
        right one over the top and save again. Ends can be left empty if you do not have them.</p>
    </div>`;

  document.getElementById("round-pick").addEventListener("change", e => {
    const [phase, round] = e.target.value.split("|");
    ENTRY_ROUND = {phase, round:+round};
    renderEnter();
  });
  const btn = document.getElementById("btn-save");
  if(btn) btn.addEventListener("click", saveResults);

  document.querySelectorAll(".btn-clear").forEach(b => {
    b.addEventListener("click", () => {
      const card = b.closest(".rinkcard");
      if(card.dataset.clear === "1"){          // second press undoes it
        card.dataset.clear = "0";
        card.classList.remove("clearing");
        b.textContent = "Clear rink";
        renderEnter();                          // put the saved scores back
        return;
      }
      const hasScore = [...card.querySelectorAll("input")].some(i => i.value.trim() !== "");
      if(card.dataset.saved === "1" && hasScore){
        const who = "Team " + card.dataset.a + " v Team " + card.dataset.b;
        if(!confirm("Clear the result for sheet " + card.dataset.sheet + ", " + who + "?\n\n"
                    + "It stays on screen until you press Save results.")) return;
      }
      card.querySelectorAll("input").forEach(i => { i.value = ""; i.classList.remove("bad"); });
      card.dataset.clear = "1";
      card.classList.add("clearing");
      b.textContent = "Undo clear";
      entryMsg("busy","Press Save results to write the change to the sheet.");
    });
  });
}

function entryMsg(kind, text){
  const el = document.getElementById("entry-msg");
  if(!el) return;
  el.className = "msg on " + kind;
  el.textContent = text;
}

async function saveResults(){
  const codeEl = document.getElementById("entry-code");
  ENTRY_CODE = codeEl.value.trim();
  if(!ENTRY_CODE){ entryMsg("bad","Enter the club code before saving."); codeEl.focus(); return; }
  if(!SAVE_URL){
    entryMsg("bad","Saving is not switched on yet. The Apps Script web app link needs to go into "
      + "SAVE_URL near the top of index.html. See the README.");
    return;
  }

  const cards = [...document.querySelectorAll(".rinkcard")];
  const matches = [];
  let bad = false;
  document.querySelectorAll(".side input").forEach(i => i.classList.remove("bad"));

  for(const card of cards){
    const get = k => card.querySelector(`[data-k="${k}"]`);
    const raw = k => get(k).value.trim();
    const sa = raw("shotsA"), sb = raw("shotsB");
    if(sa === "" && sb === ""){
      /* Blank means leave alone, unless Clear rink was pressed, in which case
         send blanks so the row is wiped in the sheet. */
      if(card.dataset.clear === "1" || card.dataset.saved === "1"){
        matches.push({phase:ENTRY_ROUND.phase, round:ENTRY_ROUND.round, sheet:card.dataset.sheet,
                      teamA:+card.dataset.a, teamB:+card.dataset.b,
                      shotsA:"", shotsB:"", endsA:"", endsB:"", cleared:true});
      }
      continue;
    }
    if(sa === "" || sb === ""){
      [get("shotsA"),get("shotsB")].forEach(i => { if(!i.value.trim()) i.classList.add("bad"); });
      bad = true; continue;
    }
    const nums = {shotsA:+sa, shotsB:+sb};
    for(const k of ["shotsA","shotsB"]){
      if(!Number.isInteger(nums[k]) || nums[k] < 0 || nums[k] > 40){ get(k).classList.add("bad"); bad = true; }
    }
    const ea = raw("endsA"), eb = raw("endsB");
    for(const [k,v] of [["endsA",ea],["endsB",eb]]){
      if(v !== "" && (!Number.isInteger(+v) || +v < 0 || +v > 16)){ get(k).classList.add("bad"); bad = true; }
    }
    matches.push({phase:ENTRY_ROUND.phase, round:ENTRY_ROUND.round, sheet:card.dataset.sheet,
                  teamA:+card.dataset.a, teamB:+card.dataset.b,
                  shotsA:nums.shotsA, shotsB:nums.shotsB,
                  endsA:ea === "" ? "" : +ea, endsB:eb === "" ? "" : +eb});
  }
  if(bad){ entryMsg("bad","Check the boxes outlined in red. Shots go 0 to 40, ends 0 to 16, and each rink needs both scores."); return; }
  const scored  = matches.filter(m => m.shotsA !== "").length;
  const cleared = matches.filter(m => m.cleared).length;
  if(!scored && !cleared){
    entryMsg("bad","Nothing to save. Enter a score, or press Clear rink on the one you want removed.");
    return;
  }

  const btn = document.getElementById("btn-save");
  btn.disabled = true;
  entryMsg("busy","Saving to the club sheet...");

  try{
    /* text/plain keeps this a simple request, so the browser does not send a
       preflight that Apps Script cannot answer. */
    const res = await fetch(SAVE_URL, {
      method:"POST", redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({code:ENTRY_CODE, season:SEASON_KEY, matches})
    });
    const out = await res.json();
    if(!out.ok) throw new Error(out.error || "the sheet rejected the update");
    const bits = [];
    if(scored)  bits.push(`${scored} ${scored===1?"rink":"rinks"} written`);
    if(cleared) bits.push(`${cleared} ${cleared===1?"rink":"rinks"} cleared`);
    entryMsg("good", `Saved at ${out.at}. ` + bits.join(" and ") + `. The tables are updating now.`);
    await loadSheet({quiet:true});
    renderEnter();
  }catch(err){
    entryMsg("bad","Could not save: " + err.message
      + ". Nothing has been changed. Check the code, or enter the scores straight into the sheet.");
  }finally{
    const b = document.getElementById("btn-save");
    if(b) b.disabled = false;
  }
}

/* ============================================================
   6. NAVIGATION AND READING THE SHEET
   ============================================================ */
const TABS = [["home","This week"],["tables","Tables"],["fixtures","Fixtures"],
              ["results","Results"],["teams","Teams"],["honours","Trophies"],
              ["enter","Enter results"]];

function show(tab){
  TABS.forEach(([id]) => {
    document.getElementById("v-"+id).classList.toggle("on", id===tab);
    const b = document.getElementById("t-"+id);
    if(id===tab){ b.setAttribute("aria-current","page"); } else { b.removeAttribute("aria-current"); }
  });
  history.replaceState(null,"","#"+tab);
  window.scrollTo({top:0,behavior:"instant"});
}

function renderAll(){
  renderHome(); renderTables(); renderFixtures(); renderResults(); renderTeams(); renderHonours();
  renderEnter();
}

function init(){
  const nav = document.getElementById("nav");
  nav.innerHTML = TABS.map(([id,label]) =>
    `<button id="t-${id}" type="button">${label}</button>`).join("");
  TABS.forEach(([id]) => document.getElementById("t-"+id).addEventListener("click",()=>show(id)));

  const sel = document.getElementById("season");
  sel.innerHTML = Object.keys(SEASONS).map(k =>
    `<option value="${k}">${k}${SEASONS[k].current?"":" (archive)"}</option>`).join("");
  sel.value = SEASON_KEY;
  sel.addEventListener("change", e => { SEASON_KEY = e.target.value; renderAll(); });

  renderAll();
  const start = location.hash.replace("#","");
  show(TABS.some(([id])=>id===start) ? start : "home");
  loadSheet();
}

/* Pulls the current season's results from a published Google Sheet if one is configured.
   Expected header row: phase,round,date,sheet,teamA,teamB,shotsA,shotsB,endsA,endsB */
async function loadSheet(opts={}){
  const foot = document.getElementById("foot-status");
  const url = SHEET_CSV_URL || SAVE_URL;
  const viaScript = !SHEET_CSV_URL && !!SAVE_URL;

  if(!url){
    foot.textContent = "Results are stored in this page. To go live, paste the Apps Script "
      + "web app link into SAVE_URL near the top of the file.";
    return;
  }

  try{
    const res = await fetch(url + (viaScript ? "?t=" + Date.now() : ""), {cache:"no-store"});
    if(!res.ok) throw new Error("the server answered " + res.status);
    const text = await res.text();

    let out;
    const looksJSON = text.trim().startsWith("{");
    if(looksJSON){
      let data;
      try{ data = JSON.parse(text); }
      catch(e){ throw new Error("the reply was not readable"); }
      if(data.error) throw new Error(data.error);
      if(!Array.isArray(data.results)) throw new Error("the script sent no results. "
        + "Redeploy it as a new version so the latest code goes live.");
      out = data.results;
    } else {
      if(/^\s*</.test(text)) throw new Error("a web page came back instead of data, "
        + "which usually means the sheet is not shared as 'Anyone with the link'");
      const rows = parseCSV(text);
      const head = (rows.shift() || []).map(x => x.trim());
      const need = ["phase","round","date","sheet","teamA","teamB","shotsA","shotsB","endsA","endsB"];
      const idx = Object.fromEntries(need.map(n => [n, head.indexOf(n)]));
      const missing = need.filter(n => idx[n] < 0);
      if(missing.length) throw new Error("the columns " + missing.join(", ")
        + " were not found. The first line received was: " + (head.join(",").slice(0,80) || "(empty)"));
      out = [];
      for(const r of rows){
        if(!r[idx.phase] || r[idx.shotsA] === "" || r[idx.shotsB] === "") continue;
        if(!r[idx.teamA] || !r[idx.teamB]) continue;
        out.push({
          phase:r[idx.phase].trim(), round:+r[idx.round], date:r[idx.date].trim(),
          sheet:r[idx.sheet].trim(), teamA:+r[idx.teamA], teamB:+r[idx.teamB],
          shotsA:+r[idx.shotsA], shotsB:+r[idx.shotsB],
          endsA:+r[idx.endsA]||0, endsB:+r[idx.endsB]||0
        });
      }
    }

    const cur = Object.keys(SEASONS).find(k => SEASONS[k].current);
    SEASONS[cur].results = out;
    renderAll();
    if(opts.quiet) show("enter");
    foot.textContent = out.length + " matches loaded from the club sheet at "
      + new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) + ".";
  }catch(err){
    foot.textContent = "The results could not be read: " + err.message
      + ". The tables show the last results saved in this page.";
  }
}

function parseCSV(text){
  const rows = []; let row = [], cell = "", q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"' && text[i+1] === '"'){ cell += '"'; i++; }
      else if(c === '"'){ q = false; }
      else cell += c;
    } else if(c === '"'){ q = true; }
    else if(c === ","){ row.push(cell); cell = ""; }
    else if(c === "\n"){ row.push(cell); rows.push(row); row = []; cell = ""; }
    else if(c !== "\r"){ cell += c; }
  }
  if(cell.length || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => v.trim() !== ""));
}

init();
